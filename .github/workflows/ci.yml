name: ci

# Public repository. Two rules follow from that and are load-bearing:
#
#   1. `pull_request` (never `pull_request_target`) so a fork's code runs with a
#      read-only token and no access to secrets. `pull_request_target` runs the
#      BASE workflow with write permissions in the context of untrusted code,
#      which is the standard way this goes wrong.
#   2. No self-hosted runners, ever, while this repo is public. A fork PR would
#      execute arbitrary code on that machine.
#
# Anything needing more than read access is gated on the PR originating from
# this repository, and is reported excluded-by-policy for forks -- excluded is
# neither a pass nor a gap, and never counts toward a verified verdict.

on:
  push:
    branches: [main]
  pull_request:

# A superseding run cancels the run you are waiting on, documentation pushes
# included. Never cancel on main: that is the gate a merge depends on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  board-lint:
    name: board-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: HAL guard
        run: ./ci/board-lint.sh

  board-lint-control:
    name: board-lint control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: identity for index operations
        run: |
          git config user.name ci
          git config user.email ci@localhost
      - name: exercise every rule in both directions
        run: ./ci/board-lint-control.sh

  record-integrity-control:
    name: record-integrity control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: identity for index operations
        run: |
          git config user.name ci
          git config user.email ci@localhost
      - name: exercise every rule in both directions
        run: ./.claude/hooks/record-integrity-control.sh

  partitions:
    name: partition table
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: validate every board's table
        run: |
          for t in boards/*/parameter.txt; do
            [ -e "$t" ] || continue
            ./ci/check-partitions.py "$t"
          done
      - name: control
        run: |
          git config user.name ci
          git config user.email ci@localhost
          ./ci/check-partitions-control.sh

  identity:
    name: author identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0        # the check reads every commit, not just HEAD
      - name: every commit is authored under the personal identity
        run: ./ci/check-identity.sh
      - name: control
        run: ./ci/check-identity-control.sh

  # Kernel build. Runs only when the GPL-2.0 source is published somewhere this
  # workflow can fetch it; until then it is NOT_RUN with the gate named below,
  # never a silent skip that reads as a pass.
  #
  # No board is named here on purpose -- the workflow iterates boards/*/ like
  # every other consumer. board-lint would reject a board literal in this file,
  # which is the guard doing its job on the CI definition itself.
  kernel:
    name: kernel build
    if: vars.BSP_KERNEL_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc \
            libssl-dev libelf-dev python3-yaml
      - name: build every board's kernel
        env:
          BSP_KERNEL_URL: ${{ vars.BSP_KERNEL_URL }}
        run: |
          for b in boards/*/; do
            ./os/build-kernel.sh --board "$(basename "$b")" --jobs "$(nproc)"
          done

  # The gate exists because a warning job that exits 0 is not execution. This
  # reads the actual results of the jobs it names; it cannot be satisfied by a
  # job that merely ran and said something reassuring.
  gate:
    name: gate
    if: always()
    needs: [board-lint, board-lint-control, record-integrity-control, partitions, identity, kernel]
    runs-on: ubuntu-24.04
    steps:
      - name: verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          fail=0
          for job in board-lint board-lint-control record-integrity-control partitions identity; do
            r=$(printf '%s' "$RESULTS" | python3 -c \
              "import json,sys;print(json.load(sys.stdin)['$job']['result'])")
            case "$r" in
              success) printf '  %-28s PASS\n' "$job" ;;
              skipped) printf '  %-28s NOT_RUN (skipped)\n' "$job"; fail=1 ;;
              cancelled) printf '  %-28s NOT_RUN (cancelled)\n' "$job"; fail=1 ;;
              *) printf '  %-28s FAIL (%s)\n' "$job" "$r"; fail=1 ;;
            esac
          done
          # The kernel build is mandatory only once its source is published.
          # Reported either way: a job nobody mentions reads as a job nobody needs.
          k='${{ needs.kernel.result }}'
          if [ -n "${{ vars.BSP_KERNEL_URL }}" ]; then
            case "$k" in
              success) printf '  %-28s PASS\n' kernel ;;
              *) printf '  %-28s FAIL (%s)\n' kernel "$k"; fail=1 ;;
            esac
          else
            printf '  %-28s NOT_RUN\n' kernel
            echo "      gate: repository variable BSP_KERNEL_URL is unset."
            echo "      The GPL-2.0 kernel source is not published anywhere this"
            echo "      workflow can fetch it. Not a pass and not a gap: it is a"
            echo "      check that has not executed."
          fi

          if [ $fail -ne 0 ]; then
            echo
            echo "GATE: NEGATIVE -- a mandatory job did not execute successfully."
            echo "A skipped or cancelled job is NOT_RUN, which blocks a verdict;"
            echo "it is not evidence that anything passed."
            exit 1
          fi
          echo
          echo "GATE: POSITIVE -- every mandatory job executed and succeeded."

  fork-policy:
    name: fork policy notice
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: report exclusion
        run: |
          echo "This PR is from a fork. Jobs requiring write access or secrets are"
          echo "excluded-by-policy (untrusted code must not run with a privileged"
          echo "credential). Excluded is neither a pass nor a gap and does not count"
          echo "toward a verified verdict. The checks above ran with a read-only"
          echo "token and are real."
